[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "envsecure"
version = "1.1.0"
description = "Encrypt .env files at rest using an Argon2id-derived key and Fernet authenticated encryption."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amirhossein Jafarnezhad" }]
keywords = ["security", "dotenv", "encryption", "argon2", "secrets-management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cryptography>=43.0",
    "argon2-cffi>=23.1",
    "typer>=0.12,<1.0",
    "python-dotenv>=1.0,<2.0",
    "zxcvbn>=4.4,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "bandit>=1.7",
]

[project.scripts]
envsecure = "envsecure.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
